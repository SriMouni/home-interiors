<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3BHK Interior Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas with a floating designer's panel (bottom sheet on phones) */
:root{
  --bg:#e4e2dc; --panel:rgba(250,248,244,.95); --ink:#1f2a2e; --muted:#5b6869;
  --line:rgba(31,42,46,.13); --accent:#1f5446; --accent-ink:#ffffff; --chip:#efece5;
  --scene:#d9d6ce; --scene-night:#11171a; --label:rgba(255,253,249,.93);
  --display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111618; --panel:rgba(22,28,31,.94); --ink:#e6ebe9; --muted:#9aa7a7;
  --line:rgba(230,235,233,.13); --accent:#7fc0a8; --accent-ink:#0e191a; --chip:#1d2629;
  --scene:#1b2225; --scene-night:#0c1012; --label:rgba(24,31,34,.93); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111618; --panel:rgba(22,28,31,.94); --ink:#e6ebe9; --muted:#9aa7a7;
  --line:rgba(230,235,233,.13); --accent:#7fc0a8; --accent-ink:#0e191a; --chip:#1d2629;
  --scene:#1b2225; --scene-night:#0c1012; --label:rgba(24,31,34,.93); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
  background:var(--label);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;
  font:600 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl small{display:block;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.lbl.minor{font-size:9.5px;padding:3px 6px;cursor:default}
.lbl:hover{border-color:var(--accent)}
.lbl:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{position:absolute;top:max(16px, env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));width:330px;
  max-height:calc(100% - 32px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.14)}
.eyebrow{margin:0;font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font:400 28px/1.05 var(--display);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.vbtn{padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);
  font:500 11.5px/1.15 var(--body);cursor:pointer}
.vbtn:hover{background:var(--chip)}
.vbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tg{display:flex;flex-direction:column;gap:2px;padding:7px 8px;border-radius:7px;border:1px solid var(--line);background:var(--chip);
  color:var(--ink);cursor:pointer;text-align:left;font:500 10px/1.1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.tg b{font:600 12.5px/1.15 var(--body);letter-spacing:0;text-transform:none;color:var(--accent)}
.note{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.note h3{margin:0;font:400 21px/1.1 var(--display)}
.note .dim{font:600 11.5px/1 var(--body);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.note p{margin:0;font-size:13px;line-height:1.5}
.note ul{margin:0;padding-left:16px;font-size:12px;line-height:1.55;color:var(--muted)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.pal div{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:1.2}
.pal i{display:block;height:30px;border-radius:6px;border:1px solid var(--line)}
.pal code{font:500 10px/1 ui-monospace,Menlo,monospace;color:var(--muted)}
.hint{position:absolute;right:max(16px, env(safe-area-inset-right,0px));bottom:max(14px, env(safe-area-inset-bottom,0px));
  font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}

.nav{position:absolute;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(max(14px, env(safe-area-inset-bottom,0px)) + 44px);
  display:grid;grid-template-columns:repeat(3,46px);gap:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.nav button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 18px/1 var(--body);cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav button:active{background:var(--accent);color:var(--accent-ink)}
.nav .wide{grid-column:1 / -1;font-size:12.5px;letter-spacing:.04em}
.nav .z2{grid-column:span 2}
.paint{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel) inset}
.tip{margin:0;font-size:11.5px;color:var(--muted)}
.item .grp{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.item .grp span{font:600 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item .row{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink);font:600 11.5px var(--body);cursor:pointer}
.mlbl{position:absolute;left:0;top:0;pointer-events:none;background:#1f2a2e;color:#fff;border-radius:6px;padding:3px 8px;font:700 12px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
#mini{position:absolute;top:max(16px, env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));width:200px;height:178px;
  border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:0 6px 18px rgba(0,0,0,.14);cursor:crosshair}
.phide{float:right;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font:600 11px var(--body);cursor:pointer}
.pshow{position:absolute;top:max(16px, env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:600 12.5px var(--body);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.zbar{position:absolute;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(max(14px, env(safe-area-inset-bottom,0px)) + 44px);display:flex;flex-direction:column;gap:6px}
.zbar button{width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 17px/1 var(--body);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.zbar button[data-z="top"]{font-size:12px}
.gal{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.gal h4{margin:0;font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--chip);aspect-ratio:4/3}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(10,12,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:50;padding:8px 8px max(10px, env(safe-area-inset-bottom,0px))}
.lbwrap{flex:1;width:100%;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
.lb img{width:100%;height:100%;max-width:none;object-fit:contain;border-radius:6px;cursor:zoom-in}
.lbwrap.zoomed{display:block}.lbwrap.zoomed img{width:auto;height:auto;max-width:none;max-height:none;min-width:180%;object-fit:initial;cursor:zoom-out}
.lb p{margin:0;color:#f2efe9;font:600 14px var(--body)}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:44px;height:44px;font:600 20px var(--body);cursor:pointer}
.lbx{top:14px;right:14px;z-index:2}
.lbdl{color:#fff;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;font:600 13px var(--body);text-decoration:none}.lbp{left:16px;top:50%;z-index:2}.lbn{right:16px;top:50%;z-index:2}
.panel{width:268px;gap:12px;padding:14px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.phead h1{margin:0;font-size:22px}
.phide{float:none}
.card{position:absolute;left:max(16px, env(safe-area-inset-left,0px));bottom:max(16px, env(safe-area-inset-bottom,0px));width:300px;max-height:min(60%,520px);overflow:auto;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.card h3{margin:0;font:400 20px/1.1 var(--display)}.card .dim{font:600 11.5px/1 var(--body);color:var(--accent)}.card p{margin:0;font-size:12.5px;line-height:1.45}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:400 20px var(--display);color:var(--muted)}
@media (max-width:720px){
  .panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46%;border-radius:16px 16px 0 0;
    padding:14px max(16px, env(safe-area-inset-right,0px)) max(14px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));gap:12px}
  h1{font-size:23px}.sub{display:none}.hint{display:none}
  .panel{max-height:34%;width:auto}
  .card{left:10px;right:10px;width:auto;bottom:calc(34% + 10px);max-height:40%}
  .nav{bottom:calc(34% + 12px);right:12px}
  #mini{width:140px;height:125px;top:10px;right:10px}
  .zbar{bottom:calc(34% + 12px);right:12px}
  .pshow{top:auto;bottom:max(14px, env(safe-area-inset-bottom,0px))}
  .views{grid-template-columns:repeat(4,1fr)}
}
</style>

<div id="app">
  <div id="loading">Building the model…</div>
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <aside class="panel" aria-label="Rooms">
    <div class="phead"><h1>Our 3 BHK</h1><button type="button" class="phide" id="pHide" aria-label="Hide panel">Hide</button></div>
    <div class="views" id="views"></div>
    <div class="toggles">
      <button class="tg" id="tWalls" type="button">Walls<b>Cutaway</b></button>
      <button class="tg" id="tLight" type="button">Light<b>Daytime</b></button>
      <button class="tg" id="tIdeas" type="button">Ideas<b>—</b></button>
      <button class="tg" id="tTour" type="button">Tour<b>Start</b></button>
      <button class="tg" id="tMeasure" type="button">Measure<b>Off</b></button>
      <button class="tg" id="tPlan" type="button">Floor plan<b>View</b></button>
    </div>
    <button class="tg" id="tClear" type="button" hidden>Colours<b>Reset</b></button>
    <button id="tLabels" type="button" hidden>Labels<b></b></button><div id="wallSw" hidden></div>
  </aside>
  <div class="card" id="note" hidden></div>
  <button type="button" id="pShow" class="pshow" hidden>☰ Panel</button>
  <div class="zbar" id="zbar" aria-label="Zoom controls">
    <button type="button" data-z="in" title="Zoom in">＋</button><button type="button" data-z="out" title="Zoom out">－</button>
    <button type="button" data-z="fit" title="Whole home">⌂</button><button type="button" data-z="top" title="Top view">Top</button>
  </div>
  <div id="lb" class="lb" hidden role="dialog" aria-label="Design idea">
    <div class="lbwrap" id="lbWrap"><img id="lbImg" alt="" title="Tap to zoom in / out"></div><p id="lbCap"></p><a id="lbDl" class="lbdl" download>Download image</a>
    <button type="button" class="lbx" id="lbClose" aria-label="Close">✕</button>
    <button type="button" class="lbp" id="lbPrev" aria-label="Previous">‹</button><button type="button" class="lbn" id="lbNext" aria-label="Next">›</button>
  </div>
  <canvas id="mini" width="400" height="356" aria-label="Mini-map: click to stand there"></canvas>
  <div class="hint" id="hint">Drag to rotate · scroll or pinch to zoom · right-drag to pan · double-click a spot to stand there</div>
  <div class="nav" id="nav" hidden aria-label="Walk controls">
    <button type="button" data-a="turnL" title="Turn left (Q)">⟲</button>
    <button type="button" data-a="fwd" title="Walk forward (W / ↑ / scroll)">▲</button>
    <button type="button" data-a="turnR" title="Turn right (E)">⟳</button>
    <button type="button" data-a="left" title="Move left (A / ←)">◀</button>
    <button type="button" data-a="back" title="Walk back (S / ↓ / scroll)">▼</button>
    <button type="button" data-a="right" title="Move right (D / →)">▶</button>
    <button type="button" data-a="zin" title="Zoom in (+)">＋</button>
    <button type="button" data-a="zout" title="Zoom out (−)" class="z2">－</button>
    <button type="button" data-a="exit" class="wide" title="Back to the whole-home view">Overview</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
const IS_TOUCH=(navigator.maxTouchPoints||0)>0;
const PI=Math.PI, H_FULL=10, H_CUT=3.6;
let H=H_CUT;
const OX=22, OZ=19.5;
const wx=X=>X-OX, wz=Z=>Z-OZ;

/* ---------- palette ---------- */
const P={taupe:'#a89580',beige:'#e3d6c3',wall:'#f2ebdf',cap:'#5a3a28',ceiling:'#f8f5ef',teak:'#7a4a2a',walnut:'#4e3324',oak:'#b98b5e',brass:'#c49a4a',
  marble:'#ece3d4',emerald:'#1f5446',ivory:'#ebe2d1',mustard:'#d29a2c',rani:'#a3325b',sage:'#8b9b7c',rust:'#b55a2e',linen:'#dccfbb',
  dusty:'#5e7489',mist:'#9fb0bd',terracotta:'#c0704c',cream:'#f2e7d5',blush:'#d9a79c',olive:'#6e7848',kSage:'#7c917a',quartz:'#f4f2ee',
  velvet:'#c8902d',cane:'#c8a46b',pot:'#b4643c'};

/* ---------- renderer ---------- */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
try{const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new THREE.RoomEnvironment(),0.04).texture;}catch(e){}
const camera=new THREE.PerspectiveCamera(50,1,0.1,400);camera.position.set(-12,48,44);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.1;controls.maxPolarAngle=PI/2-0.04;controls.minDistance=3;controls.maxDistance=110;controls.screenSpacePanning=true;controls.zoomSpeed=1.1;
const root=new THREE.Group();scene.add(root);
let wallsG=new THREE.Group();scene.add(wallsG);
const mountedG=new THREE.Group();scene.add(mountedG);   // wall-hung items: hidden in cutaway
const ceilG=new THREE.Group();scene.add(ceilG);         // false ceilings: only when standing inside

/* ---------- canvas textures ---------- */
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function mk(w,h,draw,opt){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(opt&&opt.rep)t.repeat.set(opt.rep[0],opt.rep[1]);return t;}
function veins(g,w,h,r,n,a){for(let v=0;v<n;v++){g.strokeStyle=`rgba(120,110,100,${a*(0.5+r())})`;g.lineWidth=0.8+r()*2.5;g.beginPath();let x=r()*w,y=0;g.moveTo(x,y);
  while(y<h){x+=(r()-0.5)*w*0.25;y+=h*0.12;g.lineTo(x,y);}g.stroke();}}
const T={};
T.marble=mk(1024,1024,(g,w,h)=>{const r=rnd(7);g.fillStyle='#f8f6f2';g.fillRect(0,0,w,h);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.save();g.beginPath();g.rect(i*512,j*512,512,512);g.clip();g.fillStyle=`rgba(232,226,214,${0.2+r()*0.35})`;g.fillRect(i*512,j*512,512,512);g.translate(i*512,j*512);veins(g,512,512,r,5,0.18);g.restore();}
  g.strokeStyle='rgba(170,160,150,.8)';g.lineWidth=2.5;for(let k=0;k<=2;k++){g.beginPath();g.moveTo(k*512,0);g.lineTo(k*512,h);g.stroke();g.beginPath();g.moveTo(0,k*512);g.lineTo(w,k*512);g.stroke();}});
T.wood=mk(512,512,(g,w,h)=>{const r=rnd(11),n=6,pw=w/n;for(let i=0;i<n;i++){const l=200+Math.floor(r()*45);g.fillStyle=`rgb(${l},${l},${l})`;g.fillRect(i*pw,0,pw,h);
  for(let k=0;k<18;k++){g.strokeStyle=`rgba(90,90,90,${0.05+r()*0.08})`;g.lineWidth=0.6+r();const x=i*pw+r()*pw;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+(r()-.5)*10,170,x+(r()-.5)*10,340,x,h);g.stroke();}
  g.fillStyle='rgba(60,60,60,.45)';g.fillRect(i*pw,0,1.5,h);g.fillRect(i*pw,r()*h,pw,1.5);}});
T.tile=mk(512,512,(g,w,h)=>{const r=rnd(3);for(let i=0;i<4;i++)for(let j=0;j<4;j++){const l=222+Math.floor(r()*24);g.fillStyle=`rgb(${l},${l},${l})`;g.fillRect(i*128,j*128,128,128);}
  g.strokeStyle='rgba(120,120,120,.7)';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*128,0);g.lineTo(i*128,h);g.stroke();g.beginPath();g.moveTo(0,i*128);g.lineTo(w,i*128);g.stroke();}});

const RBC={};
function rbGeo(w,h,d,r){const k=[w,h,d,r].map(v=>v.toFixed(2)).join();if(RBC[k])return RBC[k];
  r=Math.max(0.01,Math.min(r,w/2-0.02,h/2-0.02,d/2-0.02));const W=w-2*r,Hh=h-2*r,s=new THREE.Shape();
  s.moveTo(-W/2,-Hh/2);s.lineTo(W/2,-Hh/2);s.lineTo(W/2,Hh/2);s.lineTo(-W/2,Hh/2);s.lineTo(-W/2,-Hh/2);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.01,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:4,curveSegments:4,steps:1});g.center();RBC[k]=g;return g;}
function mesh(geo,mat,parent){const m=new THREE.Mesh(geo,mat);m.castShadow=!mat.transparent;m.receiveShadow=true;parent.add(m);return m;}
function B(x0,z0,x1,z1,y0,y1,mat,parent){const m=mesh(new THREE.BoxGeometry(Math.abs(x1-x0),y1-y0,Math.abs(z1-z0)),mat,parent||root);m.position.set(wx((x0+x1)/2),(y0+y1)/2,wz((z0+z1)/2));return m;}
function BR(x0,z0,x1,z1,y0,y1,mat,r,parent){const m=mesh(rbGeo(x1-x0,y1-y0,z1-z0,r),mat,parent||root);m.position.set(wx((x0+x1)/2),(y0+y1)/2,wz((z0+z1)/2));return m;}
function C(X,Z,r,y0,y1,mat,parent,seg,r2){const m=mesh(new THREE.CylinderGeometry(r2==null?r:r2,r,y1-y0,seg||24),mat,parent||root);m.position.set(wx(X),(y0+y1)/2,wz(Z));return m;}
function S(X,y,Z,r,mat,parent){const m=mesh(new THREE.SphereGeometry(r,14,10),mat,parent||root);m.position.set(wx(X),y,wz(Z));return m;}
function LB(g,x0,z0,x1,z1,y0,y1,mat){const m=mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),mat,g);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);return m;}
function LR(g,x0,z0,x1,z1,y0,y1,mat,r){const m=mesh(rbGeo(x1-x0,y1-y0,z1-z0,r==null?0.15:r),mat,g);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);return m;}
function LC(g,x,z,r,y0,y1,mat,seg,r2){const m=mesh(new THREE.CylinderGeometry(r2==null?r:r2,r,y1-y0,seg||24),mat,g);m.position.set(x,(y0+y1)/2,z);return m;}
function place(g,X,Z,deg,parent){g.position.set(wx(X),0,wz(Z));g.rotation.y=deg*PI/180;(parent||root).add(g);return g;}
function hang(m){mountedG.attach(m);return m;}
function floor(x0,z0,x1,z1,mat,ts,y){const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;const geo=new THREE.PlaneGeometry(w,d);geo.rotateX(-PI/2);
  const p=geo.attributes.position,uv=geo.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,(p.getX(i)+cx)/ts,-(p.getZ(i)+cz)/ts);

let fly=null;

function setMode(ins){inside=ins;
  Object.assign(controls,ins
    ?{enableZoom:false,enablePan:false,rotateSpeed:-0.35,minDistance:0.4,maxDistance:0.6,minPolarAngle:0.35,maxPolarAngle:PI-0.35}

  navEl.hidden=!ins;document.getElementById('zbar').hidden=ins;
  hintEl.textContent=IS_TOUCH?(ins?'Drag to look around · pinch to walk · double-tap the floor to move · tap furniture for details':'Drag to rotate · pinch to zoom · two-finger drag to pan · double-tap to stand inside'):ins?'Drag to look · ↑ ↓ walk · ← → move sideways · Q E turn · click furniture for details · click the mini-map to jump'
                        :'Drag to rotate · scroll/pinch to zoom · right-drag to pan · double-click or use the mini-map to stand inside';
  if(!ins){camera.fov=baseFov;camera.updateProjectionMatrix();}}
function flyTo(pos,tgt,ins){Object.assign(controls,{minDistance:0,maxDistance:500,minPolarAngle:0,maxPolarAngle:PI});if(!ins)setWalls(false);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const dist=camera.position.distanceTo(pos);zoomGoal=null;
  fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now(),f0:camera.fov,
       d:reduce?1:Math.min(2300,Math.max(1100,850+dist*24)),arc:reduce?0:((ins!==inside||dist>18)?Math.min(9,dist*0.16):0),mode:ins,wallsSet:!ins||H>=H_FULL};}

const fwd=new THREE.Vector3(),side=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0);
function walk(dist,strafe){camera.getWorldDirection(fwd);fwd.y=0;if(fwd.lengthSq()<1e-6)return;fwd.normalize();side.crossVectors(fwd,UP);
  const np=camera.position.clone().addScaledVector(fwd,dist).addScaledVector(side,strafe||0);
  np.x=Math.max(wx(0.6),Math.min(wx(43.4),np.x));np.z=Math.max(wz(0.6),Math.min(wz(38.4),np.z));
  const delta=np.sub(camera.position);camera.position.add(delta);controls.target.add(delta);}
function turn(deg){const off=controls.target.clone().sub(camera.position).applyAxisAngle(UP,deg*PI/180);controls.target.copy(camera.position).add(off);}
function zoomFov(f){camera.fov=Math.max(24,Math.min(80,camera.fov*f));camera.updateProjectionMatrix();}

  if(['w','s','a','d','q','e','arrowup','arrowdown','arrowleft','arrowright','+','=','-','_'].includes(k)){keys.add(k);e.preventDefault();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());

  if(a==='exit'){b.addEventListener('click',()=>go('overview'));return;}
  b.addEventListener('pointerdown',e=>{held=a;b.setPointerCapture(e.pointerId);});

const vel={f:0,s:0,t:0,z:0},imp={f:0};
function stepInside(){if(!inside||fly){vel.f=vel.s=vel.t=vel.z=0;imp.f=0;return;}const has=k=>keys.has(k);
  const tf=(has('w')||has('arrowup')||held==='fwd'?0.17:0)-(has('s')||has('arrowdown')||held==='back'?0.17:0);
  const ts=(has('d')||has('arrowright')||held==='right'?0.15:0)-(has('a')||has('arrowleft')||held==='left'?0.15:0);
  const tt=(has('q')||held==='turnL'?1.8:0)-(has('e')||held==='turnR'?1.8:0);
  const tz=(has('-')||has('_')||held==='zout'?1:0)-(has('+')||has('=')||held==='zin'?1:0);
  vel.f+=(tf-vel.f)*0.14;vel.s+=(ts-vel.s)*0.14;vel.t+=(tt-vel.t)*0.14;vel.z+=(tz-vel.z)*0.14;
  const im=imp.f*0.1;imp.f-=im;
  if(Math.abs(vel.f+im)>1e-4||Math.abs(vel.s)>1e-4)walk(vel.f+im,vel.s);
  if(Math.abs(vel.t)>1e-3)turn(vel.t);
  if(Math.abs(vel.z)>1e-3)zoomFov(1+vel.z*0.016);}

  const rc=new THREE.Raycaster();rc.setFromCamera(m,camera);const p=new THREE.Vector3();

  const pos=new THREE.Vector3(p.x,5.2,p.z);standAt(pos,pos.clone().addScaledVector(fwd,5).setY(4.6));});

  if(!it.clones[key]){it.clones[key]=orig.clone();}o.userData.orig=orig;o.material=it.clones[key];}it.clones[key].color.set(hex);}

const ray=new THREE.Raycaster();
function hitAt(e,targets){const r=canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);
  const vis=o=>{for(let p=o;p;p=p.parent)if(!p.visible)return false;return true;};
  return ray.intersectObjects(targets,true).filter(h=>vis(h.object)&&!(h.object.material.transparent&&h.object.material.opacity<0.6&&!h.object.material.alphaTest));}

let measuring=false;const measG=new THREE.Group();scene.add(measG);const MEAS=[];let mPending=null;
const dotMat=new THREE.MeshBasicMaterial({color:'#ffb000',depthTest:false}),lineMat=new THREE.LineBasicMaterial({color:'#ffb000',depthTest:false});
function ftin(d){let f=Math.floor(d),i=Math.round((d-f)*12);if(i===12){f++;i=0;}return `${f}′ ${i}″`;}
function measurePick(e){const h=hitAt(e,[root,mountedG,wallsG])[0];if(!h)return;const p=h.point.clone();
  const dot=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,8),dotMat);dot.position.copy(p);dot.renderOrder=11;measG.add(dot);
  if(!mPending){mPending=p;return;}
  const geo=new THREE.BufferGeometry().setFromPoints([mPending,p]);const ln=new THREE.Line(geo,lineMat);ln.renderOrder=11;measG.add(ln);
  const el=document.createElement('div');el.className='mlbl';el.textContent=ftin(mPending.distanceTo(p));labelsEl.appendChild(el);
  MEAS.push({el,mid:mPending.clone().add(p).multiplyScalar(0.5)});mPending=null;}
function clearMeasure(){measG.clear();MEAS.forEach(m=>m.el.remove());MEAS.length=0;mPending=null;}

const mini=document.getElementById('mini'),mg=mini.getContext('2d');const MS=400/47,MX=1.5,MZ=1.2;
const mapX=X=>(X+MX)*MS,mapZ=Z=>(Z+MZ)*MS;
const miniBg=document.createElement('canvas');miniBg.width=400;miniBg.height=356;
(function(){const g=miniBg.getContext('2d');const css=getComputedStyle(document.documentElement);
  g.fillStyle='#efe9df';g.fillRect(mapX(0),mapZ(0),44*MS,39*MS);g.strokeStyle='#5a3a28';g.lineCap='square';
  for(const [dir,c,a,b,t,ops] of WALLS){g.lineWidth=Math.max(3,t*MS);let cur=a;
    const seg=(s,e)=>{g.beginPath();if(dir==='x'){g.moveTo(mapX(s),mapZ(c));g.lineTo(mapX(e),mapZ(c));}else{g.moveTo(mapX(c),mapZ(s));g.lineTo(mapX(c),mapZ(e));}g.stroke();};
    for(const o of ops.slice().sort((p,q)=>p.a-q.a)){seg(cur,o.a);cur=o.b;}seg(cur,b);}
  g.fillStyle='#5b6869';g.font='600 13px Manrope, system-ui, sans-serif';g.textAlign='center';

  const nc=p.clone().add(base.c.clone().sub(p).multiplyScalar(f)),nt=p.clone().add(base.t.clone().sub(p).multiplyScalar(f));

/* iPad / touch: double-tap the floor to stand there, pinch inside a room to walk */
const touchPts=new Map();let pinchD=0,lastTap=0,lastTapXY=[0,0];
canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;touchPts.set(e.pointerId,[e.clientX,e.clientY]);
  if(touchPts.size===2){const [a,b]=[...touchPts.values()];pinchD=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
canvas.addEventListener('pointermove',e=>{if(!touchPts.has(e.pointerId))return;touchPts.set(e.pointerId,[e.clientX,e.clientY]);
  if(inside&&!fly&&touchPts.size===2){const [a,b]=[...touchPts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);imp.f=Math.max(-5,Math.min(5,imp.f+(d-pinchD)*0.035));pinchD=d;}});
for(const t of['pointerup','pointercancel'])canvas.addEventListener(t,e=>{if(e.pointerType!=='touch')return;const wasOne=touchPts.size===1;touchPts.delete(e.pointerId);
  if(t==='pointerup'&&wasOne){const now=performance.now();if(now-lastTap<330&&Math.hypot(e.clientX-lastTapXY[0],e.clientY-lastTapXY[1])<30){lastTap=0;
    canvas.dispatchEvent(new MouseEvent('dblclick',{clientX:e.clientX,clientY:e.clientY,bubbles:true}));}else{lastTap=now;lastTapXY=[e.clientX,e.clientY];}}});

function loop(now){
  if(fly){const k=Math.min(1,(now-fly.s)/fly.d);const e=ease(k);camera.position.lerpVectors(fly.p0,fly.p1,e);camera.position.y+=Math.sin(PI*e)*fly.arc;
    controls.target.lerpVectors(fly.t0,fly.t1,e);camera.fov=fly.f0+(baseFov-fly.f0)*e;camera.updateProjectionMatrix();
    if(!fly.wallsSet&&k>0.5){setWalls(true);fly.wallsSet=true;}
    if(k>=1){const m=fly.mode;fly=null;setMode(m);}}
  if(zoomGoal&&!fly){camera.position.lerp(zoomGoal.c,0.18);controls.target.lerp(zoomGoal.t,0.18);if(camera.position.distanceTo(zoomGoal.c)<0.03)zoomGoal=null;}
  stepInside();tourStep(now);
  controls.update();
  ceilG.visible=(H>=H_FULL)&&camera.position.y<9.6;
  renderer.render(scene,camera);
  const w=app.clientWidth,h=app.clientHeight,vis=showLabels&&camera.position.y>16;
  for(const L of LBL){if(!vis){L.el.hidden=true;continue;}v.copy(L.v).project(camera);
    if(v.z>1||Math.abs(v.x)>1.1||Math.abs(v.y)>1.1){L.el.hidden=true;continue;}
    L.el.hidden=false;L.el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-50%)`;}
  for(const m of MEAS){v.copy(m.mid).project(camera);m.el.hidden=v.z>1;m.el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-50%)`;}
  drawMini();
  requestAnimationFrame(loop);}
buildWalls();setLight(false);go('drawing');camera.position.copy(fly.p1);controls.target.copy(fly.t1);fly=null;setMode(true);
document.getElementById('loading').remove();
